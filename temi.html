<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"></svg>
<script>// Shared teaser library: deterministic, time-driven SVG scenes (frame(t) sets all state).
const NS = 'http://www.w3.org/2000/svg';
const FONT = "Arial,'Liberation Sans','DejaVu Sans',sans-serif";
const C = {
  bg: '#ffffff', ink: '#1f2937', mut: '#6b7280', line: '#d1d5db', soft: '#f3f4f6',
  blue: '#2563eb', teal: '#0d9488', amber: '#d97706', rose: '#e11d48', vio: '#7c3aed', green: '#16a34a',
  blueL: '#dbeafe', tealL: '#ccfbf1', amberL: '#fef3c7', roseL: '#ffe4e6', vioL: '#ede9fe', greenL: '#dcfce7'
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ph = (t, a, b) => ease(clamp((t - a) / (b - a)));   // eased progress a->b
const lin = (t, a, b) => clamp((t - a) / (b - a));         // linear progress a->b
const rng = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const op = (e, v) => e.setAttribute('opacity', v);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(c1, c2, u) {
  const a = hex(c1), b = hex(c2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(u)).toString(16).padStart(2, '0')).join('');
}
function txt(p, x, y, s, o = {}) {
  const lines = String(s).split('\n');
  const lh = (o.size || 12) * 1.25;
  const e = el('text', {
    x, y: o.mid ? y - (lines.length - 1) * lh / 2 + (o.size || 12) * .35 : y,
    'font-size': o.size || 12, 'font-weight': o.weight || 400, fill: o.fill || C.ink,
    'text-anchor': o.anchor || 'start', style: 'white-space:pre',
    'font-family': o.mono ? "'DejaVu Sans Mono',Menlo,monospace" : FONT
  }, p);
  lines.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; });
  e.setText = str => { const L = String(str).split('\n'); while (e.firstChild) e.removeChild(e.firstChild);
    L.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; }); };
  return e;
}
function box(p, x, y, w, h, o = {}) {
  return el('rect', { x, y, width: w, height: h, rx: o.r ?? 8, fill: o.fill || '#fff', stroke: o.stroke || C.line, 'stroke-width': o.sw || 1.5,
    ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) }, p);
}
// labelled card: returns {g, r, t, s}
function node(p, x, y, w, h, title, sub, o = {}) {
  const g = el('g', {}, p);
  const r = box(g, x, y, w, h, o);
  let t, s;
  if (sub) {
    t = txt(g, x + w / 2, y + h / 2 - 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink });
    s = txt(g, x + w / 2, y + h / 2 + 12, sub, { size: o.ss || 9.5, anchor: 'middle', fill: C.mut });
  } else {
    t = txt(g, x + w / 2, y + h / 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink, mid: true });
  }
  return { g, r, t, s, set(fill, stroke) { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); } };
}
// progressively drawn arrow along polyline pts
function arrow(p, pts, o = {}) {
  const col = o.c || C.mut;
  const d = 'M' + pts.map(q => q.join(',')).join(' L');
  const path = el('path', { d, fill: 'none', stroke: col, 'stroke-width': o.w || 1.8, pathLength: 1,
    'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, s = o.h || 7;
  const head = el('polygon', { points: `0,0 ${-s},${-s * .55} ${-s},${s * .55}`, fill: col, opacity: 0,
    transform: `translate(${b[0]},${b[1]}) rotate(${ang})` }, p);
  return {
    path, head,
    set(u) { path.setAttribute('stroke-dashoffset', 1 - u); op(head, u > .97 ? 1 : 0); },
    at(u) { const L = path.getTotalLength(); const q = path.getPointAtLength(L * clamp(u)); return [q.x, q.y]; },
    color(c) { path.setAttribute('stroke', c); head.setAttribute('fill', c); }
  };
}
// travelling packet dot
function dot(p, c = C.blue, r = 3.5) { const e = el('circle', { r, fill: c, opacity: 0 }, p);
  return { e, set(pt, o = 1) { if (!pt) { op(e, 0); return; } e.setAttribute('cx', pt[0]); e.setAttribute('cy', pt[1]); op(e, o); } }; }
function poly(p, c = C.blue, w = 1.6) { return el('polyline', { fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p); }
function setWave(pl, x, y, w, fn, n = 70) {
  let s = ''; for (let i = 0; i <= n; i++) { const u = i / n; s += (x + u * w).toFixed(1) + ',' + (y + fn(u)).toFixed(1) + ' '; }
  pl.setAttribute('points', s);
}
function typed(e, full, u) { e.setText(full.slice(0, Math.floor(full.length * clamp(u)))); }
function leaf(p, x, y, s, spots = true) {
  const G = el('g', { transform: `translate(${x},${y}) scale(${s})` }, p);
  el('path', { d: 'M0,40 C10,-10 60,-10 80,40 C60,90 10,90 0,40 Z', fill: '#86efac', stroke: C.green, 'stroke-width': 2 }, G);
  el('path', { d: 'M0,40 L80,40 M20,40 L36,22 M20,40 L36,58 M45,40 L60,26 M45,40 L60,54', stroke: C.green, 'stroke-width': 1.2, fill: 'none' }, G);
  const sp = [];
  if (spots) [[30, 24, 5], [52, 52, 6], [40, 38, 4], [62, 32, 3.5]].forEach(q => sp.push(el('circle', { cx: q[0], cy: q[1], r: q[2], fill: '#92400e', opacity: .85 }, G)));
  return { G, sp };
}

// Scene bootstrap: header, footer, loop fade
function scene(cfg) {
  const svg = document.getElementById('svg');
  el('rect', { width: 800, height: 500, fill: C.bg }, svg);
  txt(svg, 28, 34, cfg.name, { size: 21, weight: 700 });
  txt(svg, 28, 50, cfg.sub, { size: 11, fill: C.mut });
  const tw = cfg.tag.length * 6.1 + 22;
  el('rect', { x: 772 - tw, y: 16, width: tw, height: 22, rx: 11, fill: C.soft, stroke: C.line }, svg);
  txt(svg, 772 - tw / 2, 31, cfg.tag, { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
  el('line', { x1: 28, x2: 772, y1: 60, y2: 60, stroke: C.line }, svg);
  const g = el('g', {}, svg);
  txt(svg, 28, 486, cfg.cap, { size: 11, fill: C.mut });
  txt(svg, 772, 486, 'Schematic illustration', { size: 10, fill: '#9ca3af', anchor: 'end' });
  const f = cfg.build(g);
  window.SCENE = cfg;
  window.frame = t => { op(g, ph(t, 0, .5) * (1 - ph(t, cfg.T - .6, cfg.T))); f(t); };
  window.frame(0);
}
</script><script>scene({
  name: 'Multi-Agent Healthcare Assistant', tag: 'Plaksha University · 2026 · ongoing', T: 12.6, poster: 11.6,
  sub: 'LLM-powered multi-agent system on the temi robotic platform: supervised patient interaction, telepresence, reminders, staff routing',
  cap: 'An LLM orchestrator interprets each request and routes it to a specialised agent under staff supervision',
  build(g) {
    const REQ = [['"How is my schedule today?"', 0], ['"Can you call my doctor?"', 1], ['"Is it time for my pills?"', 2], ['"I need help with my bed."', 3]];
    const AG = [['Patient interaction', 'supervised dialogue'], ['Telepresence', 'remote clinician video'], ['Reminders', 'medication & schedule'], ['Staff-request routing', 'notify nurse / staff']];
    const AY = [84, 160, 236, 312];
    // patient
    const pat = el('g', {}, g); el('circle', { cx: 62, cy: 200, r: 16, fill: C.blueL, stroke: C.blue, 'stroke-width': 1.8 }, pat); el('path', { d: 'M34,250 q28,-40 56,0 z', fill: C.blueL, stroke: C.blue, 'stroke-width': 1.8 }, pat);
    txt(g, 62, 272, 'Patient', { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
    const bub = el('g', {}, g); const bubR = box(bub, 22, 100, 172, 34, { r: 12, fill: C.blueL, stroke: C.blue }); const bubT = txt(bub, 108, 121, '', { size: 10, anchor: 'middle', fill: C.ink });
    // robot (temi-like)
    const rb = el('g', {}, g);
    box(rb, 132, 190, 64, 46, { r: 10, fill: '#fff', stroke: C.ink, sw: 2 }); el('circle', { cx: 152, cy: 210, r: 3.5, fill: C.ink }, rb); el('circle', { cx: 176, cy: 210, r: 3.5, fill: C.ink }, rb);
    el('path', { d: 'M152,224 q12,7 24,0', fill: 'none', stroke: C.ink, 'stroke-width': 1.8, 'stroke-linecap': 'round' }, rb);
    el('rect', { x: 156, y: 236, width: 16, height: 12, fill: '#9ca3af' }, rb); box(rb, 138, 248, 52, 52, { r: 10, fill: '#f3f4f6', stroke: C.ink, sw: 2 });
    el('circle', { cx: 152, cy: 306, r: 6, fill: C.ink }, rb); el('circle', { cx: 176, cy: 306, r: 6, fill: C.ink }, rb);
    txt(g, 164, 332, 'temi robot', { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
    // orchestrator
    const orc = node(g, 246, 190, 132, 96, 'LLM\norchestrator', 'intent → routing', { size: 12.5, fill: C.vioL, stroke: C.vio, tc: C.vio });
    orc.t.setAttribute('y', 224); orc.s.setAttribute('y', 262);
    // agents
    const ag = AG.map((a, i) => node(g, 470, AY[i], 170, 62, a[0], a[1], { size: 11.5 }));
    // staff
    const staff = el('g', {}, g); el('circle', { cx: 712, cy: 200, r: 16, fill: C.tealL, stroke: C.teal, 'stroke-width': 1.8 }, staff); el('path', { d: 'M684,250 q28,-40 56,0 z', fill: C.tealL, stroke: C.teal, 'stroke-width': 1.8 }, staff);
    el('rect', { x: 706, y: 230, width: 12, height: 8, fill: '#fff', opacity: 0 }, staff);
    txt(g, 712, 272, 'Nurse / staff', { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
    const badge = el('g', {}, g); el('circle', { cx: 732, cy: 182, r: 9, fill: C.rose }, badge); txt(badge, 732, 186, '!', { size: 11, weight: 700, anchor: 'middle', fill: '#fff' });
    // static routes
    const r0 = arrow(g, [[196, 238], [244, 238]], { c: C.line, w: 1.6 });
    const rk = AG.map((a, i) => arrow(g, [[378, 238], [424, 238], [424, AY[i] + 31], [468, AY[i] + 31]], { c: C.line, w: 1.6 }));
    const rs = arrow(g, [[640, AY[3] + 31], [672, AY[3] + 31], [672, 262], [700, 262]], { c: C.line, w: 1.6, h: 5 });
    const pk = dot(g, C.vio, 4.5);
    // request log
    const sup = box(g, 28, 390, 744, 76, { r: 12, fill: '#fafafa' });
    txt(g, 44, 409, 'Supervised request log', { size: 11, weight: 700, fill: C.mut });
    const LOG = ['✓ schedule query → Patient interaction', '✓ doctor call → Telepresence', '✓ pill time → Reminders', '✓ bed assistance → Staff routing (nurse notified)'];
    const logT = LOG.map((s, i) => txt(g, 44 + (i % 2) * 370, 430 + Math.floor(i / 2) * 20, s, { size: 10.5, fill: C.green, weight: 700 }));
    const modules = [], mA = [];
    const route = k => [[196, 238], [244, 238], null, [378, 238], [424, 238], [424, AY[k] + 31], [468, AY[k] + 31]];
    const pathPts = k => [[110, 238], [244, 238], [378, 238], [424, 238], [424, AY[k] + 31], [470, AY[k] + 31]];
    return t => {
      op(pat, 1); [r0, ...rk].forEach((a, i) => a.set(ph(t, .2 + i * .1, .8 + i * .1))); rs.set(ph(t, .6, 1.2));
      const t0 = 2.0, L = 2.4; const k = Math.floor((t - t0) / L), s = t - t0 - k * L;
      let act = -1, moving = null;
      if (t >= t0 && k < 4) {
        bubT.setText(REQ[k][0]); op(bub, ph(s, 0, .3) * (1 - ph(s, L - .3, L)));
        const p = pathPts(REQ[k][1]); const u = lin(s, .35, 1.4);
        // manual polyline interpolation
        let tot = 0; const seg = []; for (let i = 1; i < p.length; i++) { const d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); seg.push(d); tot += d; }
        let dist = tot * u, q = p[p.length - 1]; for (let i = 0; i < seg.length; i++) { if (dist <= seg[i]) { const f = dist / seg[i]; q = [p[i][0] + (p[i + 1][0] - p[i][0]) * f, p[i][1] + (p[i + 1][1] - p[i][1]) * f]; break; } dist -= seg[i]; }
        if (u > 0 && u < 1) moving = q; if (s > 1.3) act = REQ[k][1];
      } else op(bub, 0);
      pk.set(moving, 1);
      ag.forEach((a, i) => a.set(i === act ? C.vioL : '#fff', i === act ? C.vio : C.line));
      const pulse = act === 3 ? 1 : 0; op(badge, pulse * (.6 + .4 * Math.sin(t * 12)));
      orc.set(moving || (act >= 0) ? '#f5f3ff' : C.vioL, C.vio);
      op(sup, 1); logT.forEach((l, i) => op(l, t > 2 + i * 2.4 + 1.9 ? 1 : 0));
    };
  }
});

let s=performance.now();(function L(n){frame(((n-s)/1000)%SCENE.T);requestAnimationFrame(L)})(s);</script></body></html>
