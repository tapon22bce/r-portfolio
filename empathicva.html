<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"></svg>
<script>// Shared teaser library: deterministic, time-driven SVG scenes (frame(t) sets all state).
const NS = 'http://www.w3.org/2000/svg';
const FONT = "Arial,'Liberation Sans','DejaVu Sans',sans-serif";
const C = {
  bg: '#ffffff', ink: '#1f2937', mut: '#6b7280', line: '#d1d5db', soft: '#f3f4f6',
  blue: '#2563eb', teal: '#0d9488', amber: '#d97706', rose: '#e11d48', vio: '#7c3aed', green: '#16a34a',
  blueL: '#dbeafe', tealL: '#ccfbf1', amberL: '#fef3c7', roseL: '#ffe4e6', vioL: '#ede9fe', greenL: '#dcfce7'
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ph = (t, a, b) => ease(clamp((t - a) / (b - a)));   // eased progress a->b
const lin = (t, a, b) => clamp((t - a) / (b - a));         // linear progress a->b
const rng = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const op = (e, v) => e.setAttribute('opacity', v);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(c1, c2, u) {
  const a = hex(c1), b = hex(c2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(u)).toString(16).padStart(2, '0')).join('');
}
function txt(p, x, y, s, o = {}) {
  const lines = String(s).split('\n');
  const lh = (o.size || 12) * 1.25;
  const e = el('text', {
    x, y: o.mid ? y - (lines.length - 1) * lh / 2 + (o.size || 12) * .35 : y,
    'font-size': o.size || 12, 'font-weight': o.weight || 400, fill: o.fill || C.ink,
    'text-anchor': o.anchor || 'start', style: 'white-space:pre',
    'font-family': o.mono ? "'DejaVu Sans Mono',Menlo,monospace" : FONT
  }, p);
  lines.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; });
  e.setText = str => { const L = String(str).split('\n'); while (e.firstChild) e.removeChild(e.firstChild);
    L.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; }); };
  return e;
}
function box(p, x, y, w, h, o = {}) {
  return el('rect', { x, y, width: w, height: h, rx: o.r ?? 8, fill: o.fill || '#fff', stroke: o.stroke || C.line, 'stroke-width': o.sw || 1.5,
    ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) }, p);
}
// labelled card: returns {g, r, t, s}
function node(p, x, y, w, h, title, sub, o = {}) {
  const g = el('g', {}, p);
  const r = box(g, x, y, w, h, o);
  let t, s;
  if (sub) {
    t = txt(g, x + w / 2, y + h / 2 - 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink });
    s = txt(g, x + w / 2, y + h / 2 + 12, sub, { size: o.ss || 9.5, anchor: 'middle', fill: C.mut });
  } else {
    t = txt(g, x + w / 2, y + h / 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink, mid: true });
  }
  return { g, r, t, s, set(fill, stroke) { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); } };
}
// progressively drawn arrow along polyline pts
function arrow(p, pts, o = {}) {
  const col = o.c || C.mut;
  const d = 'M' + pts.map(q => q.join(',')).join(' L');
  const path = el('path', { d, fill: 'none', stroke: col, 'stroke-width': o.w || 1.8, pathLength: 1,
    'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, s = o.h || 7;
  const head = el('polygon', { points: `0,0 ${-s},${-s * .55} ${-s},${s * .55}`, fill: col, opacity: 0,
    transform: `translate(${b[0]},${b[1]}) rotate(${ang})` }, p);
  return {
    path, head,
    set(u) { path.setAttribute('stroke-dashoffset', 1 - u); op(head, u > .97 ? 1 : 0); },
    at(u) { const L = path.getTotalLength(); const q = path.getPointAtLength(L * clamp(u)); return [q.x, q.y]; },
    color(c) { path.setAttribute('stroke', c); head.setAttribute('fill', c); }
  };
}
// travelling packet dot
function dot(p, c = C.blue, r = 3.5) { const e = el('circle', { r, fill: c, opacity: 0 }, p);
  return { e, set(pt, o = 1) { if (!pt) { op(e, 0); return; } e.setAttribute('cx', pt[0]); e.setAttribute('cy', pt[1]); op(e, o); } }; }
function poly(p, c = C.blue, w = 1.6) { return el('polyline', { fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p); }
function setWave(pl, x, y, w, fn, n = 70) {
  let s = ''; for (let i = 0; i <= n; i++) { const u = i / n; s += (x + u * w).toFixed(1) + ',' + (y + fn(u)).toFixed(1) + ' '; }
  pl.setAttribute('points', s);
}
function typed(e, full, u) { e.setText(full.slice(0, Math.floor(full.length * clamp(u)))); }
function leaf(p, x, y, s, spots = true) {
  const G = el('g', { transform: `translate(${x},${y}) scale(${s})` }, p);
  el('path', { d: 'M0,40 C10,-10 60,-10 80,40 C60,90 10,90 0,40 Z', fill: '#86efac', stroke: C.green, 'stroke-width': 2 }, G);
  el('path', { d: 'M0,40 L80,40 M20,40 L36,22 M20,40 L36,58 M45,40 L60,26 M45,40 L60,54', stroke: C.green, 'stroke-width': 1.2, fill: 'none' }, G);
  const sp = [];
  if (spots) [[30, 24, 5], [52, 52, 6], [40, 38, 4], [62, 32, 3.5]].forEach(q => sp.push(el('circle', { cx: q[0], cy: q[1], r: q[2], fill: '#92400e', opacity: .85 }, G)));
  return { G, sp };
}

// Scene bootstrap: header, footer, loop fade
function scene(cfg) {
  const svg = document.getElementById('svg');
  el('rect', { width: 800, height: 500, fill: C.bg }, svg);
  txt(svg, 28, 34, cfg.name, { size: 21, weight: 700 });
  txt(svg, 28, 50, cfg.sub, { size: 11, fill: C.mut });
  const tw = cfg.tag.length * 6.1 + 22;
  el('rect', { x: 772 - tw, y: 16, width: tw, height: 22, rx: 11, fill: C.soft, stroke: C.line }, svg);
  txt(svg, 772 - tw / 2, 31, cfg.tag, { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
  el('line', { x1: 28, x2: 772, y1: 60, y2: 60, stroke: C.line }, svg);
  const g = el('g', {}, svg);
  txt(svg, 28, 486, cfg.cap, { size: 11, fill: C.mut });
  txt(svg, 772, 486, 'Schematic illustration', { size: 10, fill: '#9ca3af', anchor: 'end' });
  const f = cfg.build(g);
  window.SCENE = cfg;
  window.frame = t => { op(g, ph(t, 0, .5) * (1 - ph(t, cfg.T - .6, cfg.T))); f(t); };
  window.frame(0);
}
</script><script>scene({
  name: 'EmpathicVA-LLM', tag: 'J. Automation & Intelligence · under review', T: 12, poster: 10.6,
  sub: 'Context-aware, emotionally adaptive voice assistant: multi-modal framework for empathetic human-agent interaction',
  cap: 'Whisper-large-v3 + WavLM / emotion2vec+ → affect-aware prompt → Llama-3-8B aligned with RLHF and DPO',
  build(g) {
    const TXT = 'I missed the deadline\nagain... I feel useless.';
    const RESP = "That sounds really hard. Missing one deadline doesn't define you. Want to plan the next step together?";
    // user speech
    box(g, 28, 84, 128, 190, { r: 12, fill: '#fafafa' });
    txt(g, 92, 104, 'User speech', { size: 11.5, weight: 700, anchor: 'middle', fill: C.blue });
    const w1 = poly(g, C.blue, 2);
    el('circle', { cx: 92, cy: 246, r: 9, fill: C.blueL, stroke: C.blue }, g);
    // perception
    box(g, 186, 84, 246, 190, { r: 12, fill: '#fafafa' });
    txt(g, 309, 104, 'Perception', { size: 11.5, weight: 700, anchor: 'middle', fill: C.mut });
    const asr = node(g, 198, 114, 222, 56, 'Whisper-large-v3', null, { size: 11, r: 8 }); asr.t.setAttribute('y', 132); asr.t.setAttribute('font-size', 10.5);
    const asrT = txt(g, 208, 148, '', { size: 9, mono: true, fill: C.ink });
    const emo = node(g, 198, 180, 222, 84, 'WavLM · emotion2vec+', null, { size: 11, r: 8 }); emo.t.setAttribute('y', 198); emo.t.setAttribute('font-size', 10.5);
    const emoN = [['sad', .62, C.blue], ['anxious', .24, C.amber], ['neutral', .1, C.mut]];
    const emoB = emoN.map((e, i) => { txt(g, 208, 216 + i * 15, e[0], { size: 9.5, fill: C.mut });
      return el('rect', { x: 262, y: 208 + i * 15, width: 0, height: 9, rx: 3, fill: e[2] }, g); });
    // fusion prompt
    const fp = node(g, 460, 84, 120, 190, '', null, { r: 12, fill: C.tealL, stroke: C.teal });
    txt(g, 520, 104, 'Affect-aware', { size: 11.5, weight: 700, anchor: 'middle', fill: C.teal }); txt(g, 520, 118, 'prompt', { size: 11.5, weight: 700, anchor: 'middle', fill: C.teal });
    const fpL = txt(g, 470, 148, '', { size: 9, mono: true, fill: C.ink });
    // LLM
    const llm = node(g, 610, 84, 162, 190, '', null, { r: 12, fill: C.vioL, stroke: C.vio });
    txt(g, 691, 106, 'Llama-3-8B', { size: 13, weight: 700, anchor: 'middle', fill: C.vio });
    txt(g, 691, 121, 'empathetic decoder', { size: 9.5, anchor: 'middle', fill: C.mut });
    const layers = [0, 1, 2, 3].map(i => box(g, 632, 138 + i * 22, 118, 14, { r: 4, fill: '#fff', stroke: C.vio, sw: 1.2 }));
    const badge = node(g, 632, 232, 118, 28, 'RLHF + DPO alignment', null, { size: 9.5, r: 14, fill: '#fff', stroke: C.vio, tc: C.vio });
    // arrows
    const A = [arrow(g, [[156, 130], [186, 130]], { c: C.blue }), arrow(g, [[432, 180], [460, 180]], { c: C.teal }), arrow(g, [[580, 180], [608, 180]], { c: C.vio })];
    const pk = dot(g, C.teal, 3.5);
    // bottom row: DPO + response
    box(g, 28, 300, 300, 160, { r: 12, fill: '#fafafa' });
    txt(g, 44, 320, 'DPO preference pair', { size: 11.5, weight: 700, fill: C.mut });
    const pref = node(g, 44, 332, 268, 46, '', null, { r: 8 }); txt(pref.g, 54, 350, '✓ "That sounds really hard…"', { size: 10.5, fill: C.green, weight: 700 }); txt(pref.g, 54, 366, 'empathetic · validates feeling', { size: 9.5, fill: C.mut });
    const rej = node(g, 44, 388, 268, 46, '', null, { r: 8 }); txt(rej.g, 54, 406, '✗ "Just try harder next time."', { size: 10.5, fill: C.rose, weight: 700 }); txt(rej.g, 54, 422, 'dismissive · rejected', { size: 9.5, fill: C.mut });
    box(g, 356, 300, 416, 160, { r: 12, fill: '#fafafa' });
    txt(g, 372, 320, 'Empathetic spoken response', { size: 11.5, weight: 700, fill: C.mut });
    const bub = box(g, 372, 332, 384, 68, { r: 12, fill: C.vioL, stroke: C.vio });
    const respT = txt(g, 386, 352, '', { size: 11.5, fill: C.ink });
    const w2 = poly(g, C.vio, 2);
    const respWords = RESP.split(' ');
    return t => {
      setWave(w1, 40, 172, 104, u => Math.sin(u * 40 - t * 12) * 34 * (.4 + .6 * Math.abs(Math.sin(u * 6 + t))), 80);
      A[0].set(ph(t, .5, 1.1));
      const lines = (s, n) => { const w = s.split(' '); const out = []; let cur = ''; w.forEach(x => { if ((cur + ' ' + x).length > n) { out.push(cur); cur = x; } else cur = cur ? cur + ' ' + x : x; }); out.push(cur); return out.join('\n'); };
      op(asr.g, ph(t, 1.1, 1.6)); op(emo.g, ph(t, 1.1, 1.6)); typed(asrT, TXT, lin(t, 1.7, 3));
      emoB.forEach((b, i) => b.setAttribute('width', 150 * emoN[i][1] * ph(t, 2.4 + i * .2, 3.2 + i * .2)));
      A[1].set(ph(t, 3.4, 3.9)); op(fp.g, ph(t, 3.7, 4.2));
      const fpFull = '[emotion]\n sad 0.62\n anxious 0.24\n[user]\n "I missed the\n deadline again..."\n[style]\n empathetic,\n supportive'; typed(fpL, fpFull, lin(t, 4.2, 5.4));
      fpL.setText(fpFull.slice(0, Math.floor(fpFull.length * lin(t, 4.2, 5.4))));
      A[2].set(ph(t, 5.3, 5.8)); op(llm.g, ph(t, 5.6, 6)); op(badge.g, ph(t, 5.8, 6.3));
      layers.forEach((l, i) => { const on = t > 6 && t < 8.5 && Math.floor((t - 6) * 4) % 5 === i; l.setAttribute('fill', on ? C.vioL : '#fff'); });
      op(pref.g, ph(t, 6, 6.6)); op(rej.g, ph(t, 6.3, 6.9));
      const u = lin(t, 6.6, 9.6); const nw = Math.floor(respWords.length * u);
      respT.setText(lines(respWords.slice(0, nw).join(' '), 58)); op(bub, ph(t, 6.5, 7)); op(respT, ph(t, 6.5, 7));
      setWave(w2, 372, 430, 384, x => Math.sin(x * 60 - t * 10) * 16 * Math.sin(x * Math.PI) * (u > 0 && u < 1 ? 1 : .05), 100);
      op(w2, ph(t, 6.6, 7));
      pk.set(t > 3.4 && t < 5.4 ? [432 + 28 * lin(t, 3.4, 3.9), 180] : t > 5.3 && t < 6 ? [580 + 28 * lin(t, 5.3, 5.8), 180] : null, .9);
    };
  }
});

let s=performance.now();(function L(n){frame(((n-s)/1000)%SCENE.T);requestAnimationFrame(L)})(s);</script></body></html>
