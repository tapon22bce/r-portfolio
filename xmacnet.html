<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"></svg>
<script>// Shared teaser library: deterministic, time-driven SVG scenes (frame(t) sets all state).
const NS = 'http://www.w3.org/2000/svg';
const FONT = "Arial,'Liberation Sans','DejaVu Sans',sans-serif";
const C = {
  bg: '#ffffff', ink: '#1f2937', mut: '#6b7280', line: '#d1d5db', soft: '#f3f4f6',
  blue: '#2563eb', teal: '#0d9488', amber: '#d97706', rose: '#e11d48', vio: '#7c3aed', green: '#16a34a',
  blueL: '#dbeafe', tealL: '#ccfbf1', amberL: '#fef3c7', roseL: '#ffe4e6', vioL: '#ede9fe', greenL: '#dcfce7'
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ph = (t, a, b) => ease(clamp((t - a) / (b - a)));   // eased progress a->b
const lin = (t, a, b) => clamp((t - a) / (b - a));         // linear progress a->b
const rng = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const op = (e, v) => e.setAttribute('opacity', v);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(c1, c2, u) {
  const a = hex(c1), b = hex(c2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(u)).toString(16).padStart(2, '0')).join('');
}
function txt(p, x, y, s, o = {}) {
  const lines = String(s).split('\n');
  const lh = (o.size || 12) * 1.25;
  const e = el('text', {
    x, y: o.mid ? y - (lines.length - 1) * lh / 2 + (o.size || 12) * .35 : y,
    'font-size': o.size || 12, 'font-weight': o.weight || 400, fill: o.fill || C.ink,
    'text-anchor': o.anchor || 'start', style: 'white-space:pre',
    'font-family': o.mono ? "'DejaVu Sans Mono',Menlo,monospace" : FONT
  }, p);
  lines.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; });
  if (o.at !== undefined) (window.REV = window.REV || []).push([e, o.at]);
  e.setText = str => { const L = String(str).split('\n'); while (e.firstChild) e.removeChild(e.firstChild);
    L.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; }); };
  return e;
}
function box(p, x, y, w, h, o = {}) {
  const _b = el('rect', { x, y, width: w, height: h, rx: o.r ?? 8, fill: o.fill || '#fff', stroke: o.stroke || C.line, 'stroke-width': o.sw || 1.5,
    ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) }, p);
  if (o.at !== undefined) (window.REV = window.REV || []).push([_b, o.at]);
  return _b;
}
// labelled card: returns {g, r, t, s}
function node(p, x, y, w, h, title, sub, o = {}) {
  const g = el('g', {}, p);
  const r = box(g, x, y, w, h, o);
  let t, s;
  if (sub) {
    t = txt(g, x + w / 2, y + h / 2 - 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink });
    s = txt(g, x + w / 2, y + h / 2 + 12, sub, { size: o.ss || 9.5, anchor: 'middle', fill: C.mut });
  } else {
    t = txt(g, x + w / 2, y + h / 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink, mid: true });
  }
  return { g, r, t, s, set(fill, stroke) { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); } };
}
// progressively drawn arrow along polyline pts
function arrow(p, pts, o = {}) {
  const col = o.c || C.mut;
  const d = 'M' + pts.map(q => q.join(',')).join(' L');
  const path = el('path', { d, fill: 'none', stroke: col, 'stroke-width': o.w || 1.8, pathLength: 1,
    'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, s = o.h || 7;
  const head = el('polygon', { points: `0,0 ${-s},${-s * .55} ${-s},${s * .55}`, fill: col, opacity: 0,
    transform: `translate(${b[0]},${b[1]}) rotate(${ang})` }, p);
  return {
    path, head,
    set(u) { path.setAttribute('stroke-dashoffset', 1 - u); op(head, u > .97 ? 1 : 0); },
    at(u) { const L = path.getTotalLength(); const q = path.getPointAtLength(L * clamp(u)); return [q.x, q.y]; },
    color(c) { path.setAttribute('stroke', c); head.setAttribute('fill', c); }
  };
}
// travelling packet dot
function dot(p, c = C.blue, r = 3.5) { const e = el('circle', { r, fill: c, opacity: 0 }, p);
  return { e, set(pt, o = 1) { if (!pt) { op(e, 0); return; } e.setAttribute('cx', pt[0]); e.setAttribute('cy', pt[1]); op(e, o); } }; }
function poly(p, c = C.blue, w = 1.6) { return el('polyline', { fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p); }
function setWave(pl, x, y, w, fn, n = 70) {
  let s = ''; for (let i = 0; i <= n; i++) { const u = i / n; s += (x + u * w).toFixed(1) + ',' + (y + fn(u)).toFixed(1) + ' '; }
  pl.setAttribute('points', s);
}
function typed(e, full, u) { e.setText(full.slice(0, Math.floor(full.length * clamp(u)))); }
function leaf(p, x, y, s, spots = true) {
  const G = el('g', { transform: `translate(${x},${y}) scale(${s})` }, p);
  el('path', { d: 'M0,40 C10,-10 60,-10 80,40 C60,90 10,90 0,40 Z', fill: '#86efac', stroke: C.green, 'stroke-width': 2 }, G);
  el('path', { d: 'M0,40 L80,40 M20,40 L36,22 M20,40 L36,58 M45,40 L60,26 M45,40 L60,54', stroke: C.green, 'stroke-width': 1.2, fill: 'none' }, G);
  const sp = [];
  if (spots) [[30, 24, 5], [52, 52, 6], [40, 38, 4], [62, 32, 3.5]].forEach(q => sp.push(el('circle', { cx: q[0], cy: q[1], r: q[2], fill: '#92400e', opacity: .85 }, G)));
  return { G, sp };
}

// Scene bootstrap: header, footer, loop fade
function scene(cfg) {
  const svg = document.getElementById('svg');
  el('rect', { width: 800, height: 500, fill: C.bg }, svg);
  txt(svg, 28, 34, cfg.name, { size: 21, weight: 700 });
  txt(svg, 28, 50, cfg.sub, { size: 11, fill: C.mut });
  const tw = cfg.tag.length * 6.1 + 22;
  el('rect', { x: 772 - tw, y: 16, width: tw, height: 22, rx: 11, fill: C.soft, stroke: C.line }, svg);
  txt(svg, 772 - tw / 2, 31, cfg.tag, { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
  el('line', { x1: 28, x2: 772, y1: 60, y2: 60, stroke: C.line }, svg);
  const g = el('g', {}, svg);
  txt(svg, 28, 486, cfg.cap, { size: 11, fill: C.mut });
  txt(svg, 772, 486, 'Schematic illustration', { size: 10, fill: '#9ca3af', anchor: 'end' });
  const f = cfg.build(g);
  window.SCENE = cfg;
  window.frame = t => { op(g, ph(t, 0, .5) * (1 - ph(t, cfg.T - .6, cfg.T))); f(t); (window.REV || []).forEach(r => op(r[0], ph(t, r[1], r[1] + .5))); };
  window.frame(0);
}
</script><script>scene({
  name: 'XMACNet', tag: 'Springer LNICST · 2025', T: 9, poster: 7.6,
  sub: 'Explainable lightweight attention CNN with RGB + vegetation-index fusion for chili disease classification',
  cap: 'EfficientNetV2S + self-attention · NDVI / NPCI / MCARI fusion · Grad-CAM++ and SHAP explanations',
  build(g) {
    const r = rng(11);
    const inLeaf = leaf(g, 28, 150, 1.25);
    const lblIn = txt(g, 78, 282, 'Chili leaf image', { size: 10.5, anchor: 'middle', fill: C.mut });
    // branch labels
    const l1 = txt(g, 190, 84, 'RGB stream', { size: 11, weight: 700, fill: C.blue });
    const l2 = txt(g, 190, 257, 'Vegetation-index stream', { size: 11, weight: 700, fill: C.amber });
    const a1 = arrow(g, [[136, 190], [160, 190], [160, 118], [184, 118]], { c: C.blue });
    const a2 = arrow(g, [[136, 216], [160, 216], [160, 292], [184, 292]], { c: C.amber });
    // conv blocks
    const blocks = [0, 1, 2, 3].map(i => box(g, 190 + i * 40, 93, 34, 50, { r: 5 }));
    const lblB = txt(g, 190, 160, 'EfficientNetV2S backbone', { size: 9.5, fill: C.mut });
    const attn = node(g, 385, 93, 104, 50, 'Self-attention', 'feature re-weighting', { fill: C.vioL, stroke: C.vio, tc: C.vio });
    const links = [];
    for (let i = 0; i < 4; i++) links.push(el('line', { stroke: C.vio, 'stroke-width': 1, opacity: 0 }, g));
    // index tiles
    const names = ['NDVI', 'NPCI', 'MCARI'];
    const tiles = names.map((n, k) => {
      const G = el('g', {}, g); const cells = [];
      for (let i = 0; i < 5; i++) for (let j = 0; j < 5; j++) {
        const v = clamp(.35 + .5 * Math.sin(i * .9 + k) * Math.cos(j * .8 + k * 2) + (r() - .5) * .3);
        cells.push(el('rect', { x: 190 + k * 62 + i * 10.4, y: 267 + j * 10.4, width: 10.4, height: 10.4, fill: mix('#b45309', '#22c55e', v) }, G));
      }
      el('rect', { x: 190 + k * 62, y: 267, width: 52, height: 52, fill: 'none', stroke: C.line }, G);
      txt(G, 190 + k * 62 + 26, 334, n, { size: 10, anchor: 'middle', weight: 700, fill: C.mut });
      return G;
    });
    const spec = node(g, 385, 267, 104, 52, 'Spectral encoder', 'index features', { fill: C.amberL, stroke: C.amber, tc: C.amber });
    const a3 = arrow(g, [[344, 118], [383, 118]], { c: C.blue });
    const a4 = arrow(g, [[346, 292], [383, 292]], { c: C.amber });
    // fusion
    const fus = el('g', {}, g);
    el('circle', { cx: 545, cy: 205, r: 24, fill: C.tealL, stroke: C.teal, 'stroke-width': 1.8 }, fus);
    txt(fus, 545, 213, '+', { size: 26, weight: 700, anchor: 'middle', fill: C.teal });
    txt(fus, 536, 256, 'Multi-modal fusion', { size: 10, anchor: 'end', fill: C.teal, weight: 700 });
    const a5 = arrow(g, [[489, 118], [545, 118], [545, 180]], { c: C.vio });
    const a6 = arrow(g, [[489, 292], [545, 292], [545, 230]], { c: C.amber });
    const clf = node(g, 594, 175, 72, 60, 'Classifier', null, { fill: C.soft });
    const a7 = arrow(g, [[569, 205], [592, 205]], { c: C.teal });
    const a8 = arrow(g, [[666, 205], [684, 205]], { c: C.mut });
    const labs = ['H', '1', '2', '3', '4', '5'];
    const target = [.06, .08, .05, .93, .04, .07]; // illustrative: class 3 predicted
    const bars = labs.map((l, i) => {
      const b = el('rect', { x: 688 + i * 14, y: 262, width: 10, height: 0, rx: 2, fill: i === 3 ? C.teal : C.line }, g);
      txt(g, 693 + i * 14, 275, l, { size: 8.5, anchor: 'middle', fill: C.mut, at: 5.4 });
      return b;
    });
    const tPred = txt(g, 730, 158, 'Class probabilities', { size: 9.5, weight: 700, anchor: 'middle', fill: C.mut });
    // explainability row
    const exL = txt(g, 28, 380, 'Explainability', { size: 12, weight: 700, fill: C.ink });
    const exS = txt(g, 28, 394, 'why the model decided', { size: 9.5, fill: C.mut });
    const pA = box(g, 150, 372, 130, 92, { r: 8 });
    const tA = txt(g, 156, 385, 'Grad-CAM++', { size: 9.5, weight: 700, fill: C.mut });
    const lf2 = leaf(g, 172, 398, 0.82);
    const defs = el('defs', {}, g);
    const rgd = el('radialGradient', { id: 'hm' }, defs);
    [['0%', '#ef4444', .85], ['45%', '#f59e0b', .55], ['100%', '#f59e0b', 0]].forEach(s => el('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] }, rgd));
    const heat = el('ellipse', { cx: 200, cy: 431, rx: 22, ry: 17, fill: 'url(#hm)' }, g);
    const pB = box(g, 296, 372, 178, 92, { r: 8 });
    const tB = txt(g, 304, 385, 'SHAP · modality contribution', { size: 9.5, weight: 700, fill: C.mut });
    const shapN = ['RGB', 'NDVI', 'NPCI', 'MCARI'], shapV = [.9, .7, .4, .55], shapC = [C.blue, C.amber, C.amber, C.amber];
    const shap = shapN.map((n, i) => {
      txt(g, 304, 404 + i * 15, n, { size: 9.5, fill: C.mut, at: 6.2 });
      return el('rect', { x: 348, y: 396 + i * 15, width: 0, height: 9, rx: 3, fill: shapC[i] }, g);
    });
    const chipT = ['12,000 leaf images · 5 diseases + healthy', 'StyleGAN-augmented training data', 'Compact & fast → edge deployment'];
    const chips = chipT.map((s, i) => {
      const G = el('g', {}, g); box(G, 500, 374 + i * 30, 272, 24, { r: 12, fill: C.soft });
      txt(G, 636, 390 + i * 30, s, { size: 10.5, anchor: 'middle', fill: C.ink }); return G;
    });

    return t => {
      op(inLeaf.G, ph(t, .3, 1)); op(lblIn, ph(t, .5, 1));
      inLeaf.sp.forEach((s, i) => s.setAttribute('r', [5, 6, 4, 3.5][i] * ph(t, .8 + i * .15, 1.3 + i * .15)));
      [l1, l2].forEach(e => op(e, ph(t, 1.2, 1.8)));
      a1.set(ph(t, 1.2, 1.9)); a2.set(ph(t, 1.2, 1.9));
      blocks.forEach((b, i) => { const u = ph(t, 1.9 + i * .3, 2.3 + i * .3); b.setAttribute('fill', mix('#ffffff', C.blueL, u)); b.setAttribute('stroke', mix(C.line, C.blue, u)); });
      op(lblB, ph(t, 2, 2.6));
      tiles.forEach((G, k) => op(G, ph(t, 1.9 + k * .25, 2.5 + k * .25)));
      a3.set(ph(t, 3.1, 3.5)); a4.set(ph(t, 3.1, 3.5));
      op(attn.g, ph(t, 3.4, 3.9)); op(spec.g, ph(t, 3.4, 3.9));
      links.forEach((l, i) => { const x1 = 395 + i * 22; l.setAttribute('x1', x1); l.setAttribute('y1', 132); l.setAttribute('x2', 395 + ((i + 1) % 4) * 22 + Math.sin(t * 3 + i) * 3); l.setAttribute('y2', 103);
        op(l, 0); });
      a5.set(ph(t, 4, 4.5)); a6.set(ph(t, 4, 4.5)); op(fus, ph(t, 4.3, 4.8));
      const pulse = 1 + .06 * Math.sin(t * 6) * ph(t, 4.8, 5); fus.setAttribute('transform', `translate(545 205) scale(${pulse}) translate(-545 -205)`);
      a7.set(ph(t, 4.9, 5.2)); op(clf.g, ph(t, 4.9, 5.3)); a8.set(ph(t, 5.2, 5.5)); op(tPred, ph(t, 5.3, 5.8));
      bars.forEach((b, i) => { const h = 88 * target[i] * ph(t, 5.4, 6.2); b.setAttribute('height', h); b.setAttribute('y', 262 - h); });
      [exL, exS, pA, tA, pB, tB].forEach(e => op(e, ph(t, 5.6, 6.2)));
      op(lf2.G, ph(t, 5.6, 6.2));
      op(heat, ph(t, 6, 6.8) * (.75 + .25 * Math.sin(t * 4)));
      shap.forEach((s, i) => s.setAttribute('width', 110 * shapV[i] * ph(t, 6.2 + i * .15, 7 + i * .15)));
      shapN.forEach(() => 0);
      chips.forEach((c, i) => op(c, ph(t, 6.4 + i * .3, 7 + i * .3)));
    };
  }
});

let s=performance.now();(function L(n){frame(((n-s)/1000)%SCENE.T);requestAnimationFrame(L)})(s);</script></body></html>
