<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"></svg>
<script>// Shared teaser library: deterministic, time-driven SVG scenes (frame(t) sets all state).
const NS = 'http://www.w3.org/2000/svg';
const FONT = "Arial,'Liberation Sans','DejaVu Sans',sans-serif";
const C = {
  bg: '#ffffff', ink: '#1f2937', mut: '#6b7280', line: '#d1d5db', soft: '#f3f4f6',
  blue: '#2563eb', teal: '#0d9488', amber: '#d97706', rose: '#e11d48', vio: '#7c3aed', green: '#16a34a',
  blueL: '#dbeafe', tealL: '#ccfbf1', amberL: '#fef3c7', roseL: '#ffe4e6', vioL: '#ede9fe', greenL: '#dcfce7'
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ph = (t, a, b) => ease(clamp((t - a) / (b - a)));   // eased progress a->b
const lin = (t, a, b) => clamp((t - a) / (b - a));         // linear progress a->b
const rng = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const op = (e, v) => e.setAttribute('opacity', v);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(c1, c2, u) {
  const a = hex(c1), b = hex(c2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(u)).toString(16).padStart(2, '0')).join('');
}
function txt(p, x, y, s, o = {}) {
  const lines = String(s).split('\n');
  const lh = (o.size || 12) * 1.25;
  const e = el('text', {
    x, y: o.mid ? y - (lines.length - 1) * lh / 2 + (o.size || 12) * .35 : y,
    'font-size': o.size || 12, 'font-weight': o.weight || 400, fill: o.fill || C.ink,
    'text-anchor': o.anchor || 'start', style: 'white-space:pre',
    'font-family': o.mono ? "'DejaVu Sans Mono',Menlo,monospace" : FONT
  }, p);
  lines.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; });
  if (o.at !== undefined) (window.REV = window.REV || []).push([e, o.at]);
  e.setText = str => { const L = String(str).split('\n'); while (e.firstChild) e.removeChild(e.firstChild);
    L.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; }); };
  return e;
}
function box(p, x, y, w, h, o = {}) {
  const _b = el('rect', { x, y, width: w, height: h, rx: o.r ?? 8, fill: o.fill || '#fff', stroke: o.stroke || C.line, 'stroke-width': o.sw || 1.5,
    ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) }, p);
  if (o.at !== undefined) (window.REV = window.REV || []).push([_b, o.at]);
  return _b;
}
// labelled card: returns {g, r, t, s}
function node(p, x, y, w, h, title, sub, o = {}) {
  const g = el('g', {}, p);
  const r = box(g, x, y, w, h, o);
  let t, s;
  if (sub) {
    t = txt(g, x + w / 2, y + h / 2 - 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink });
    s = txt(g, x + w / 2, y + h / 2 + 12, sub, { size: o.ss || 9.5, anchor: 'middle', fill: C.mut });
  } else {
    t = txt(g, x + w / 2, y + h / 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink, mid: true });
  }
  return { g, r, t, s, set(fill, stroke) { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); } };
}
// progressively drawn arrow along polyline pts
function arrow(p, pts, o = {}) {
  const col = o.c || C.mut;
  const d = 'M' + pts.map(q => q.join(',')).join(' L');
  const path = el('path', { d, fill: 'none', stroke: col, 'stroke-width': o.w || 1.8, pathLength: 1,
    'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, s = o.h || 7;
  const head = el('polygon', { points: `0,0 ${-s},${-s * .55} ${-s},${s * .55}`, fill: col, opacity: 0,
    transform: `translate(${b[0]},${b[1]}) rotate(${ang})` }, p);
  return {
    path, head,
    set(u) { path.setAttribute('stroke-dashoffset', 1 - u); op(head, u > .97 ? 1 : 0); },
    at(u) { const L = path.getTotalLength(); const q = path.getPointAtLength(L * clamp(u)); return [q.x, q.y]; },
    color(c) { path.setAttribute('stroke', c); head.setAttribute('fill', c); }
  };
}
// travelling packet dot
function dot(p, c = C.blue, r = 3.5) { const e = el('circle', { r, fill: c, opacity: 0 }, p);
  return { e, set(pt, o = 1) { if (!pt) { op(e, 0); return; } e.setAttribute('cx', pt[0]); e.setAttribute('cy', pt[1]); op(e, o); } }; }
function poly(p, c = C.blue, w = 1.6) { return el('polyline', { fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p); }
function setWave(pl, x, y, w, fn, n = 70) {
  let s = ''; for (let i = 0; i <= n; i++) { const u = i / n; s += (x + u * w).toFixed(1) + ',' + (y + fn(u)).toFixed(1) + ' '; }
  pl.setAttribute('points', s);
}
function typed(e, full, u) { e.setText(full.slice(0, Math.floor(full.length * clamp(u)))); }
function leaf(p, x, y, s, spots = true) {
  const G = el('g', { transform: `translate(${x},${y}) scale(${s})` }, p);
  el('path', { d: 'M0,40 C10,-10 60,-10 80,40 C60,90 10,90 0,40 Z', fill: '#86efac', stroke: C.green, 'stroke-width': 2 }, G);
  el('path', { d: 'M0,40 L80,40 M20,40 L36,22 M20,40 L36,58 M45,40 L60,26 M45,40 L60,54', stroke: C.green, 'stroke-width': 1.2, fill: 'none' }, G);
  const sp = [];
  if (spots) [[30, 24, 5], [52, 52, 6], [40, 38, 4], [62, 32, 3.5]].forEach(q => sp.push(el('circle', { cx: q[0], cy: q[1], r: q[2], fill: '#92400e', opacity: .85 }, G)));
  return { G, sp };
}

// Scene bootstrap: header, footer, loop fade
function scene(cfg) {
  const svg = document.getElementById('svg');
  el('rect', { width: 800, height: 500, fill: C.bg }, svg);
  txt(svg, 28, 34, cfg.name, { size: 21, weight: 700 });
  txt(svg, 28, 50, cfg.sub, { size: 11, fill: C.mut });
  const tw = cfg.tag.length * 6.1 + 22;
  el('rect', { x: 772 - tw, y: 16, width: tw, height: 22, rx: 11, fill: C.soft, stroke: C.line }, svg);
  txt(svg, 772 - tw / 2, 31, cfg.tag, { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
  el('line', { x1: 28, x2: 772, y1: 60, y2: 60, stroke: C.line }, svg);
  const g = el('g', {}, svg);
  txt(svg, 28, 486, cfg.cap, { size: 11, fill: C.mut });
  txt(svg, 772, 486, 'Schematic illustration', { size: 10, fill: '#9ca3af', anchor: 'end' });
  const f = cfg.build(g);
  window.SCENE = cfg;
  window.frame = t => { op(g, ph(t, 0, .5) * (1 - ph(t, cfg.T - .6, cfg.T))); f(t); (window.REV || []).forEach(r => op(r[0], ph(t, r[1], r[1] + .5))); };
  window.frame(0);
}
</script><script>scene({
  name: 'Segment-Based Optimal BST', tag: 'Algorithmica · under review · NCUR 2026', T: 12.5, poster: 11.0,
  sub: 'Segment-based dynamic programming with hierarchical weight partitioning for optimal binary search trees',
  cap: 'Weights are split hierarchically into segments; the DP table fills segment by segment (sub-cubic vs. classic O(n³))',
  build(g) {
    const w = [4, 2, 6, 9, 3, 7, 2, 5], n = w.length, tot = w.reduce((a, b) => a + b, 0);
    const pre = [0]; w.forEach(x => pre.push(pre[pre.length - 1] + x));
    const sum = (l, r) => pre[r + 1] - pre[l];
    const nodesT = []; // {k, depth, l, r}
    (function build(l, r, d) {
      if (l > r) return null;
      let best = l, bd = 1e9;
      for (let k = l; k <= r; k++) { const dd = Math.abs(sum(l, k - 1 < l ? l - 1 : k - 1) * 0 + (k > l ? sum(l, k - 1) : 0) - (k < r ? sum(k + 1, r) : 0)); if (dd < bd) { bd = dd; best = k; } }
      const me = { k: best, d, l, r, par: null, kids: [] }; nodesT.push(me);
      const L = build(l, best - 1, d + 1), R = build(best + 1, r, d + 1);
      if (L) { L.par = me; me.kids.push(L); } if (R) { R.par = me; me.kids.push(R); }
      return me;
    })(0, n - 1, 0);
    const maxD = Math.max(...nodesT.map(x => x.d));
    let cost = 0; nodesT.forEach(x => cost += w[x.k] * (x.d + 1)); cost /= tot;
    // panel A: weights
    txt(g, 28, 84, 'Key weights  (access frequency)', { size: 11, weight: 700, fill: C.mut });
    const BX = 40, BW = 30, BS = 44, BASE = 190;
    const bars = w.map((v, i) => { const r = el('rect', { x: BX + i * BS, y: BASE, width: BW, height: 0, rx: 4, fill: C.blue }, g);
      txt(g, BX + i * BS + BW / 2, BASE + 13, 'k' + (i + 1), { size: 9.5, anchor: 'middle', fill: C.mut });
      const l = txt(g, BX + i * BS + BW / 2, BASE - 2, String(v), { size: 9, anchor: 'middle', fill: C.blue, weight: 700 }); return { r, l }; });
    // segment bands by level
    const colors = [C.vio, C.teal, C.amber, C.rose];
    const bands = [];
    nodesT.forEach(x => {
      const y = BASE + 24 + x.d * 13;
      const b = el('g', {}, g);
      el('rect', { x: BX + x.l * BS, y, width: (x.r - x.l + 1) * BS - 14, height: 9, rx: 4.5, fill: colors[x.d % 4], opacity: .28 }, b);
      el('rect', { x: BX + x.l * BS + (x.k - x.l) * BS + BW / 2 - 3, y: y + 2, width: 6, height: 5, rx: 2.5, fill: colors[x.d % 4] }, b);
      bands.push({ b, d: x.d });
    });
    const rings = nodesT.map(x => el('circle', { r: 0, opacity: 0 }, g));
    txt(g, 28, BASE + 24 + (maxD + 1) * 13 + 14, 'segments by level  (▬ = weighted split point)', { size: 9.5, fill: C.mut });
    // panel B: DP table
    txt(g, 28, 304, 'DP table  e[i, j]  (filled by interval length)', { size: 11, weight: 700, fill: C.mut, at: 6 });
    const CS = 16, TX = 60, TY = 322;
    const cells = [];
    for (let i = 0; i < n; i++) for (let j = i; j < n; j++) {
      const len = j - i + 1;
      cells.push({ len, i, j, r: el('rect', { x: TX + j * CS, y: TY + i * CS, width: CS - 2, height: CS - 2, rx: 3, fill: C.soft }, g) });
    }
    for (let i = 0; i < n; i++) { txt(g, TX - 8, TY + i * CS + 11, String(i + 1), { size: 8.5, anchor: 'end', fill: C.mut, at: 6 }); txt(g, TX + i * CS + 7, TY - 4, String(i + 1), { size: 8.5, anchor: 'middle', fill: C.mut, at: 6 }); }
    const fin = el('rect', { x: TX + (n - 1) * CS - 1, y: TY - 1, width: CS, height: CS, rx: 4, fill: 'none', stroke: C.rose, 'stroke-width': 2.2 }, g);
    const costT = txt(g, 220, 420, '', { size: 12, weight: 700, fill: C.rose });
    // panel C: tree
    box(g, 470, 72, 302, 396, { r: 12, fill: '#fafafa' });
    txt(g, 484, 92, 'Resulting search tree', { size: 11, weight: 700, fill: C.mut });
    const io = []; (function ino(x) { })();
    const order = [...nodesT].sort((a, b) => a.k - b.k); order.forEach((x, i) => { x.px = 494 + i * (262 / (n - 1)); x.py = 122 + x.d * (300 / Math.max(maxD, 1)) * .95; });
    const tEdges = nodesT.filter(x => x.par).map(x => ({ x, e: el('line', { x1: x.par.px, y1: x.par.py, x2: x.px, y2: x.py, stroke: C.mut, 'stroke-width': 1.6 }, g) }));
    const tNodes = nodesT.map(x => { const G = el('g', {}, g); el('circle', { cx: x.px, cy: x.py, r: 15, fill: '#fff', stroke: colors[x.d % 4], 'stroke-width': 2 }, G);
      txt(G, x.px, x.py + 4, 'k' + (x.k + 1), { size: 10, weight: 700, anchor: 'middle' }); return { G, x }; });
    return t => {
      bars.forEach((b, i) => { const h = w[i] * 9 * ph(t, .4 + i * .08, 1.2 + i * .08); b.r.setAttribute('height', h); b.r.setAttribute('y', BASE - h); b.l.setAttribute('y', BASE - h - 3); op(b.l, ph(t, .8 + i * .08, 1.2 + i * .08)); });
      const lvl = d => 2 + d * 1.0;
      bands.forEach(b => op(b.b, ph(t, lvl(b.d), lvl(b.d) + .6)));
      rings.forEach((r, i) => { const d = nodesT[i].d; r.setAttribute('r', 8 * ph(t, lvl(d) + .2, lvl(d) + .7)); });
      tEdges.forEach(o => { const u = ph(t, lvl(o.x.d) + .3, lvl(o.x.d) + .9); op(o.e, u); });
      tNodes.forEach(o => op(o.G, ph(t, lvl(o.x.d) + .3, lvl(o.x.d) + .9)));
      const T0 = 2 + (maxD + 1) * 1.0 + .8, T1 = T0 + 3.4;
      cells.forEach(c => { const u = ph(t, T0 + (c.len - 1) * (T1 - T0) / n, T0 + c.len * (T1 - T0) / n); c.r.setAttribute('fill', mix(C.soft, [C.blueL, C.vioL, C.tealL, C.amberL][Math.floor((c.i * 4) / n) % 4], u)); });
      op(fin, ph(t, T1 - .2, T1 + .3) * (.6 + .4 * Math.sin(t * 6)));
      costT.setText('E[cost] = ' + (cost * ph(t, T1, T1 + .6)).toFixed(2)); op(costT, ph(t, T1 - .1, T1 + .3));
    };
  }
});

let s=performance.now();(function L(n){frame(((n-s)/1000)%SCENE.T);requestAnimationFrame(L)})(s);</script></body></html>
