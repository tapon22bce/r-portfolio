<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"></svg>
<script>// Shared teaser library: deterministic, time-driven SVG scenes (frame(t) sets all state).
const NS = 'http://www.w3.org/2000/svg';
const FONT = "Arial,'Liberation Sans','DejaVu Sans',sans-serif";
const C = {
  bg: '#ffffff', ink: '#1f2937', mut: '#6b7280', line: '#d1d5db', soft: '#f3f4f6',
  blue: '#2563eb', teal: '#0d9488', amber: '#d97706', rose: '#e11d48', vio: '#7c3aed', green: '#16a34a',
  blueL: '#dbeafe', tealL: '#ccfbf1', amberL: '#fef3c7', roseL: '#ffe4e6', vioL: '#ede9fe', greenL: '#dcfce7'
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ph = (t, a, b) => ease(clamp((t - a) / (b - a)));   // eased progress a->b
const lin = (t, a, b) => clamp((t - a) / (b - a));         // linear progress a->b
const rng = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const op = (e, v) => e.setAttribute('opacity', v);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(c1, c2, u) {
  const a = hex(c1), b = hex(c2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(u)).toString(16).padStart(2, '0')).join('');
}
function txt(p, x, y, s, o = {}) {
  const lines = String(s).split('\n');
  const lh = (o.size || 12) * 1.25;
  const e = el('text', {
    x, y: o.mid ? y - (lines.length - 1) * lh / 2 + (o.size || 12) * .35 : y,
    'font-size': o.size || 12, 'font-weight': o.weight || 400, fill: o.fill || C.ink,
    'text-anchor': o.anchor || 'start', style: 'white-space:pre',
    'font-family': o.mono ? "'DejaVu Sans Mono',Menlo,monospace" : FONT
  }, p);
  lines.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; });
  e.setText = str => { const L = String(str).split('\n'); while (e.firstChild) e.removeChild(e.firstChild);
    L.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; }); };
  return e;
}
function box(p, x, y, w, h, o = {}) {
  return el('rect', { x, y, width: w, height: h, rx: o.r ?? 8, fill: o.fill || '#fff', stroke: o.stroke || C.line, 'stroke-width': o.sw || 1.5,
    ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) }, p);
}
// labelled card: returns {g, r, t, s}
function node(p, x, y, w, h, title, sub, o = {}) {
  const g = el('g', {}, p);
  const r = box(g, x, y, w, h, o);
  let t, s;
  if (sub) {
    t = txt(g, x + w / 2, y + h / 2 - 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink });
    s = txt(g, x + w / 2, y + h / 2 + 12, sub, { size: o.ss || 9.5, anchor: 'middle', fill: C.mut });
  } else {
    t = txt(g, x + w / 2, y + h / 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink, mid: true });
  }
  return { g, r, t, s, set(fill, stroke) { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); } };
}
// progressively drawn arrow along polyline pts
function arrow(p, pts, o = {}) {
  const col = o.c || C.mut;
  const d = 'M' + pts.map(q => q.join(',')).join(' L');
  const path = el('path', { d, fill: 'none', stroke: col, 'stroke-width': o.w || 1.8, pathLength: 1,
    'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, s = o.h || 7;
  const head = el('polygon', { points: `0,0 ${-s},${-s * .55} ${-s},${s * .55}`, fill: col, opacity: 0,
    transform: `translate(${b[0]},${b[1]}) rotate(${ang})` }, p);
  return {
    path, head,
    set(u) { path.setAttribute('stroke-dashoffset', 1 - u); op(head, u > .97 ? 1 : 0); },
    at(u) { const L = path.getTotalLength(); const q = path.getPointAtLength(L * clamp(u)); return [q.x, q.y]; },
    color(c) { path.setAttribute('stroke', c); head.setAttribute('fill', c); }
  };
}
// travelling packet dot
function dot(p, c = C.blue, r = 3.5) { const e = el('circle', { r, fill: c, opacity: 0 }, p);
  return { e, set(pt, o = 1) { if (!pt) { op(e, 0); return; } e.setAttribute('cx', pt[0]); e.setAttribute('cy', pt[1]); op(e, o); } }; }
function poly(p, c = C.blue, w = 1.6) { return el('polyline', { fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p); }
function setWave(pl, x, y, w, fn, n = 70) {
  let s = ''; for (let i = 0; i <= n; i++) { const u = i / n; s += (x + u * w).toFixed(1) + ',' + (y + fn(u)).toFixed(1) + ' '; }
  pl.setAttribute('points', s);
}
function typed(e, full, u) { e.setText(full.slice(0, Math.floor(full.length * clamp(u)))); }
function leaf(p, x, y, s, spots = true) {
  const G = el('g', { transform: `translate(${x},${y}) scale(${s})` }, p);
  el('path', { d: 'M0,40 C10,-10 60,-10 80,40 C60,90 10,90 0,40 Z', fill: '#86efac', stroke: C.green, 'stroke-width': 2 }, G);
  el('path', { d: 'M0,40 L80,40 M20,40 L36,22 M20,40 L36,58 M45,40 L60,26 M45,40 L60,54', stroke: C.green, 'stroke-width': 1.2, fill: 'none' }, G);
  const sp = [];
  if (spots) [[30, 24, 5], [52, 52, 6], [40, 38, 4], [62, 32, 3.5]].forEach(q => sp.push(el('circle', { cx: q[0], cy: q[1], r: q[2], fill: '#92400e', opacity: .85 }, G)));
  return { G, sp };
}

// Scene bootstrap: header, footer, loop fade
function scene(cfg) {
  const svg = document.getElementById('svg');
  el('rect', { width: 800, height: 500, fill: C.bg }, svg);
  txt(svg, 28, 34, cfg.name, { size: 21, weight: 700 });
  txt(svg, 28, 50, cfg.sub, { size: 11, fill: C.mut });
  const tw = cfg.tag.length * 6.1 + 22;
  el('rect', { x: 772 - tw, y: 16, width: tw, height: 22, rx: 11, fill: C.soft, stroke: C.line }, svg);
  txt(svg, 772 - tw / 2, 31, cfg.tag, { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
  el('line', { x1: 28, x2: 772, y1: 60, y2: 60, stroke: C.line }, svg);
  const g = el('g', {}, svg);
  txt(svg, 28, 486, cfg.cap, { size: 11, fill: C.mut });
  txt(svg, 772, 486, 'Schematic illustration', { size: 10, fill: '#9ca3af', anchor: 'end' });
  const f = cfg.build(g);
  window.SCENE = cfg;
  window.frame = t => { op(g, ph(t, 0, .5) * (1 - ph(t, cfg.T - .6, cfg.T))); f(t); };
  window.frame(0);
}
</script><script>scene({
  name: 'ETHOS-ALIGN · ETHICS-UI', tag: 'BTech thesis · targeting ACM CHI', T: 12.5, poster: 11.4,
  sub: 'Interactive ethical constraint specification (CSL) compiled to temporal logic and verified against LLM decision traces',
  cap: 'CSL editor → LTL / CTL compiler → verification engine → auditable verdicts in an HCI interface',
  build(g) {
    const CODE = ['constraint triage_safety {', '  domain: medical', '  always: risk == high', '    -> eventually escalate', '  never: dose > max_safe', '}'];
    // 1 editor
    box(g, 28, 76, 200, 176, { r: 10, fill: '#fafafa' });
    txt(g, 42, 96, '1  CSL editor', { size: 11, weight: 700, fill: C.blue });
    el('rect', { x: 38, y: 104, width: 180, height: 138, rx: 6, fill: '#111827' }, g);
    const code = CODE.map((l, i) => txt(g, 46, 122 + i * 19, '', { size: 9.5, mono: true, fill: '#e5e7eb' }));
    const caret = el('rect', { width: 5, height: 11, fill: '#93c5fd' }, g);
    // 2 formulas
    box(g, 262, 76, 190, 176, { r: 10, fill: '#fafafa' });
    txt(g, 276, 96, '2  Temporal logic', { size: 11, weight: 700, fill: C.vio });
    const F = ['G ( risk_high →', '    F escalate )', '', 'AG ¬ ( dose > max_safe )'];
    const form = F.map((l, i) => txt(g, 276, 130 + i * 20 + (i > 2 ? 10 : 0), '', { size: 10.5, mono: true, fill: C.vio }));
    txt(g, 276, 236, 'LTL  ·  CTL', { size: 9.5, fill: C.mut });
    // 3 verifier
    box(g, 486, 76, 130, 176, { r: 10, fill: '#fafafa' });
    txt(g, 551, 96, '3  Verifier', { size: 11, weight: 700, anchor: 'middle', fill: C.teal });
    const mc = node(g, 500, 110, 102, 60, 'Model\nchecker', null, { size: 11.5, fill: C.tealL, stroke: C.teal, tc: C.teal });
    txt(g, 551, 196, 'Verification', { size: 9.5, anchor: 'middle', fill: C.mut }); txt(g, 551, 208, 'engine', { size: 9.5, anchor: 'middle', fill: C.mut });
    const scan = el('circle', { r: 9, fill: 'none', stroke: C.teal, 'stroke-width': 2 }, g); const scanH = el('line', { stroke: C.teal, 'stroke-width': 2.4, 'stroke-linecap': 'round' }, g);
    // 4 audit UI
    box(g, 650, 76, 122, 176, { r: 10, fill: '#fafafa' });
    txt(g, 711, 96, '4  Audit UI', { size: 11, weight: 700, anchor: 'middle', fill: C.rose });
    const v1 = node(g, 660, 108, 102, 44, '', null, { r: 6 }); txt(v1.g, 668, 126, '✓ escalate rule', { size: 9.5, fill: C.green, weight: 700 }); txt(v1.g, 668, 141, 'holds on trace', { size: 9, fill: C.mut });
    const v2 = node(g, 660, 160, 102, 44, '', null, { r: 6 }); txt(v2.g, 668, 178, '✗ dose rule', { size: 9.5, fill: C.rose, weight: 700 }); txt(v2.g, 668, 193, 'violated at s5', { size: 9, fill: C.mut });
    txt(g, 711, 232, 'stress-test · audit', { size: 9, anchor: 'middle', fill: C.mut });
    const A = [arrow(g, [[228, 164], [260, 164]], { c: C.blue }), arrow(g, [[452, 164], [484, 164]], { c: C.vio }), arrow(g, [[616, 164], [648, 164]], { c: C.teal })];
    const loop = arrow(g, [[711, 254], [711, 276], [128, 276], [128, 254]], { c: C.rose, w: 1.5 });
    txt(g, 420, 271, 'refine constraint', { size: 9.5, anchor: 'middle', fill: C.rose });
    // bottom: LLM trace
    box(g, 28, 296, 744, 118, { r: 12, fill: '#fafafa' });
    txt(g, 44, 316, 'LLM decision trace  (checked at inference time)', { size: 11, weight: 700, fill: C.mut });
    const acts = ['assess', 'risk=high', 'query', 'recommend', 'dose>max', 'escalate', 'done'];
    const sx = i => 84 + i * 104;
    const tl = [];
    for (let i = 0; i < 6; i++) tl.push(arrow(g, [[sx(i) + 15, 362], [sx(i + 1) - 15, 362]], { c: C.mut, w: 1.4, h: 5 }));
    const st = acts.map((a, i) => { const G = el('g', {}, g); const c = el('circle', { cx: sx(i), cy: 362, r: 15, fill: '#fff', stroke: C.mut, 'stroke-width': 1.8 }, G);
      txt(G, sx(i), 366, 's' + (i + 1), { size: 10, weight: 700, anchor: 'middle' }); txt(G, sx(i), 396, a, { size: 9.5, anchor: 'middle', fill: C.mut, mono: false }); return { G, c }; });
    const cur = el('circle', { cy: 362, r: 21, fill: 'none', stroke: C.teal, 'stroke-width': 2.4 }, g);
    const viol = txt(g, sx(4), 336, '', { size: 10, weight: 700, anchor: 'middle', fill: C.rose });
    // domain chips
    const doms = ['Medical triage', 'Legal advice', 'Autonomous systems'];
    const chips = doms.map((d, i) => { const G = el('g', {}, g); const r = box(G, 200 + i * 140, 430, 128, 24, { r: 12, fill: C.soft }); txt(G, 264 + i * 140, 446, d, { size: 10, anchor: 'middle' }); return { G, r }; });
    txt(g, 44, 446, 'High-stakes domains', { size: 10, weight: 700, fill: C.mut });
    return t => {
      const codeStr = CODE.join('\n'); const nch = Math.floor(codeStr.length * lin(t, .5, 3.4)); let rem = nch, ci = 0, cx = 46, cy = 122;
      CODE.forEach((l, i) => { const k = Math.max(0, Math.min(l.length, rem)); code[i].setText(l.slice(0, k)); if (rem >= 0 && rem <= l.length && ci === i) { } rem -= l.length + 1; });
      let r2 = nch, li = 0; while (li < CODE.length - 1 && r2 > CODE[li].length) { r2 -= CODE[li].length + 1; li++; }
      caret.setAttribute('x', 46 + Math.max(0, r2) * 5.72); caret.setAttribute('y', 113 + li * 19); op(caret, t < 3.6 && Math.floor(t * 4) % 2 ? 0 : (t < 3.6 ? 1 : 0));
      A[0].set(ph(t, 3.5, 4)); const fs = F.join('\n'); const ft = lin(t, 4, 5.4);
      F.forEach((l, i) => { const a = F.slice(0, i).join('\n').length + (i ? 1 : 0); form[i].setText(l.slice(0, Math.max(0, Math.min(l.length, Math.floor(fs.length * ft) - a)))); });
      A[1].set(ph(t, 5.4, 5.9)); op(mc.g, 1);
      st.forEach((s, i) => op(s.G, ph(t, 1.5 + i * .25, 2 + i * .25))); tl.forEach((a, i) => a.set(ph(t, 1.8 + i * .25, 2.3 + i * .25)));
      const sc = lin(t, 6.2, 9.2); const idx = Math.min(6, sc * 7);
      const cp = sx(0) + (sx(6) - sx(0)) * Math.min(1, sc); cur.setAttribute('cx', cp); op(cur, sc > 0 && sc < 1.02 ? 1 : 0);
      st.forEach((s, i) => { const done = sc * 7 > i + .5; const bad = i === 4 && done; s.c.setAttribute('fill', bad ? C.roseL : done ? C.greenL : '#fff'); s.c.setAttribute('stroke', bad ? C.rose : done ? C.green : C.mut); });
      viol.setText(sc * 7 > 4.5 ? '✗ violates  □ ¬(dose > max_safe)' : ''); op(viol, ph(t, 8, 8.4));
      const mx = 551 + 10 * Math.sin(t * 5), my = 140 + 6 * Math.cos(t * 5);
      op(scan, sc > 0 && sc < 1 ? 1 : 0); op(scanH, sc > 0 && sc < 1 ? 1 : 0); scan.setAttribute('cx', mx); scan.setAttribute('cy', my);
      scanH.setAttribute('x1', mx + 6.5); scanH.setAttribute('y1', my + 6.5); scanH.setAttribute('x2', mx + 13); scanH.setAttribute('y2', my + 13);
      A[2].set(ph(t, 9, 9.5)); op(v1.g, ph(t, 9.4, 9.9)); op(v2.g, ph(t, 9.7, 10.2));
      loop.set(ph(t, 10.2, 11));
      chips.forEach((c, i) => { const on = Math.floor(t / 1.2) % 3 === i && t > 2; c.r.setAttribute('fill', on ? C.blueL : C.soft); c.r.setAttribute('stroke', on ? C.blue : C.line); });
    };
  }
});

let s=performance.now();(function L(n){frame(((n-s)/1000)%SCENE.T);requestAnimationFrame(L)})(s);</script></body></html>
