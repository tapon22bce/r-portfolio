<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body><svg id="svg" xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"></svg>
<script>// Shared teaser library: deterministic, time-driven SVG scenes (frame(t) sets all state).
const NS = 'http://www.w3.org/2000/svg';
const FONT = "Arial,'Liberation Sans','DejaVu Sans',sans-serif";
const C = {
  bg: '#ffffff', ink: '#1f2937', mut: '#6b7280', line: '#d1d5db', soft: '#f3f4f6',
  blue: '#2563eb', teal: '#0d9488', amber: '#d97706', rose: '#e11d48', vio: '#7c3aed', green: '#16a34a',
  blueL: '#dbeafe', tealL: '#ccfbf1', amberL: '#fef3c7', roseL: '#ffe4e6', vioL: '#ede9fe', greenL: '#dcfce7'
};
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ph = (t, a, b) => ease(clamp((t - a) / (b - a)));   // eased progress a->b
const lin = (t, a, b) => clamp((t - a) / (b - a));         // linear progress a->b
const rng = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const op = (e, v) => e.setAttribute('opacity', v);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(c1, c2, u) {
  const a = hex(c1), b = hex(c2);
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * clamp(u)).toString(16).padStart(2, '0')).join('');
}
function txt(p, x, y, s, o = {}) {
  const lines = String(s).split('\n');
  const lh = (o.size || 12) * 1.25;
  const e = el('text', {
    x, y: o.mid ? y - (lines.length - 1) * lh / 2 + (o.size || 12) * .35 : y,
    'font-size': o.size || 12, 'font-weight': o.weight || 400, fill: o.fill || C.ink,
    'text-anchor': o.anchor || 'start', style: 'white-space:pre',
    'font-family': o.mono ? "'DejaVu Sans Mono',Menlo,monospace" : FONT
  }, p);
  lines.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; });
  if (o.at !== undefined) (window.REV = window.REV || []).push([e, o.at]);
  e.setText = str => { const L = String(str).split('\n'); while (e.firstChild) e.removeChild(e.firstChild);
    L.forEach((l, i) => { const ts = el('tspan', { x, dy: i ? lh : 0 }, e); ts.textContent = l; }); };
  return e;
}
function box(p, x, y, w, h, o = {}) {
  const _b = el('rect', { x, y, width: w, height: h, rx: o.r ?? 8, fill: o.fill || '#fff', stroke: o.stroke || C.line, 'stroke-width': o.sw || 1.5,
    ...(o.dash ? { 'stroke-dasharray': o.dash } : {}) }, p);
  if (o.at !== undefined) (window.REV = window.REV || []).push([_b, o.at]);
  return _b;
}
// labelled card: returns {g, r, t, s}
function node(p, x, y, w, h, title, sub, o = {}) {
  const g = el('g', {}, p);
  const r = box(g, x, y, w, h, o);
  let t, s;
  if (sub) {
    t = txt(g, x + w / 2, y + h / 2 - 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink });
    s = txt(g, x + w / 2, y + h / 2 + 12, sub, { size: o.ss || 9.5, anchor: 'middle', fill: C.mut });
  } else {
    t = txt(g, x + w / 2, y + h / 2, title, { size: o.size || 12, weight: 700, anchor: 'middle', fill: o.tc || C.ink, mid: true });
  }
  return { g, r, t, s, set(fill, stroke) { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); } };
}
// progressively drawn arrow along polyline pts
function arrow(p, pts, o = {}) {
  const col = o.c || C.mut;
  const d = 'M' + pts.map(q => q.join(',')).join(' L');
  const path = el('path', { d, fill: 'none', stroke: col, 'stroke-width': o.w || 1.8, pathLength: 1,
    'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, p);
  const a = pts[pts.length - 2], b = pts[pts.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI, s = o.h || 7;
  const head = el('polygon', { points: `0,0 ${-s},${-s * .55} ${-s},${s * .55}`, fill: col, opacity: 0,
    transform: `translate(${b[0]},${b[1]}) rotate(${ang})` }, p);
  return {
    path, head,
    set(u) { path.setAttribute('stroke-dashoffset', 1 - u); op(head, u > .97 ? 1 : 0); },
    at(u) { const L = path.getTotalLength(); const q = path.getPointAtLength(L * clamp(u)); return [q.x, q.y]; },
    color(c) { path.setAttribute('stroke', c); head.setAttribute('fill', c); }
  };
}
// travelling packet dot
function dot(p, c = C.blue, r = 3.5) { const e = el('circle', { r, fill: c, opacity: 0 }, p);
  return { e, set(pt, o = 1) { if (!pt) { op(e, 0); return; } e.setAttribute('cx', pt[0]); e.setAttribute('cy', pt[1]); op(e, o); } }; }
function poly(p, c = C.blue, w = 1.6) { return el('polyline', { fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, p); }
function setWave(pl, x, y, w, fn, n = 70) {
  let s = ''; for (let i = 0; i <= n; i++) { const u = i / n; s += (x + u * w).toFixed(1) + ',' + (y + fn(u)).toFixed(1) + ' '; }
  pl.setAttribute('points', s);
}
function typed(e, full, u) { e.setText(full.slice(0, Math.floor(full.length * clamp(u)))); }
function leaf(p, x, y, s, spots = true) {
  const G = el('g', { transform: `translate(${x},${y}) scale(${s})` }, p);
  el('path', { d: 'M0,40 C10,-10 60,-10 80,40 C60,90 10,90 0,40 Z', fill: '#86efac', stroke: C.green, 'stroke-width': 2 }, G);
  el('path', { d: 'M0,40 L80,40 M20,40 L36,22 M20,40 L36,58 M45,40 L60,26 M45,40 L60,54', stroke: C.green, 'stroke-width': 1.2, fill: 'none' }, G);
  const sp = [];
  if (spots) [[30, 24, 5], [52, 52, 6], [40, 38, 4], [62, 32, 3.5]].forEach(q => sp.push(el('circle', { cx: q[0], cy: q[1], r: q[2], fill: '#92400e', opacity: .85 }, G)));
  return { G, sp };
}

// Scene bootstrap: header, footer, loop fade
function scene(cfg) {
  const svg = document.getElementById('svg');
  el('rect', { width: 800, height: 500, fill: C.bg }, svg);
  txt(svg, 28, 34, cfg.name, { size: 21, weight: 700 });
  txt(svg, 28, 50, cfg.sub, { size: 11, fill: C.mut });
  const tw = cfg.tag.length * 6.1 + 22;
  el('rect', { x: 772 - tw, y: 16, width: tw, height: 22, rx: 11, fill: C.soft, stroke: C.line }, svg);
  txt(svg, 772 - tw / 2, 31, cfg.tag, { size: 10.5, anchor: 'middle', fill: C.mut, weight: 700 });
  el('line', { x1: 28, x2: 772, y1: 60, y2: 60, stroke: C.line }, svg);
  const g = el('g', {}, svg);
  txt(svg, 28, 486, cfg.cap, { size: 11, fill: C.mut });
  txt(svg, 772, 486, 'Schematic illustration', { size: 10, fill: '#9ca3af', anchor: 'end' });
  const f = cfg.build(g);
  window.SCENE = cfg;
  window.frame = t => { op(g, ph(t, 0, .5) * (1 - ph(t, cfg.T - .6, cfg.T))); f(t); (window.REV || []).forEach(r => op(r[0], ph(t, r[1], r[1] + .5))); };
  window.frame(0);
}
</script><script>scene({
  name: 'Behavior Prediction Survey', tag: 'J. Ambient Intell. Humaniz. Comput. · under review', T: 10, poster: 8,
  sub: 'Human behavior prediction from speech, emotion and gesture using deep learning: a comprehensive survey',
  cap: 'Survey taxonomy: modalities → deep architectures → fusion strategies → predicted behavior',
  build(g) {
    const heads = [['Modalities', 28, 150], ['Deep architectures', 226, 160], ['Fusion', 412, 120], ['Behavior prediction', 558, 214]];
    const hd = heads.map(h => txt(g, h[1] + h[2] / 2, 84, h[0], { size: 11.5, weight: 700, anchor: 'middle', fill: C.mut }));
    // column 1 cards
    const cardY = [95, 200, 305];
    const cards = cardY.map((y, i) => { const G = el('g', {}, g); box(G, 28, y, 150, 100, { r: 10, fill: '#fafafa' }); txt(G, 40, y + 18, ['Speech', 'Emotion', 'Gesture'][i], { size: 12, weight: 700, fill: [C.blue, C.amber, C.teal][i] }); return G; });
    const wave = poly(g, C.blue, 1.8);
    const face = el('g', {}, g);
    el('circle', { cx: 103, cy: 254, r: 24, fill: C.amberL, stroke: C.amber, 'stroke-width': 1.6 }, face);
    el('circle', { cx: 95, cy: 248, r: 2.5, fill: C.ink }, face); el('circle', { cx: 111, cy: 248, r: 2.5, fill: C.ink }, face);
    const mouth = el('path', { fill: 'none', stroke: C.ink, 'stroke-width': 1.8, 'stroke-linecap': 'round' }, face);
    const emoLbl = txt(g, 103, 292, '', { size: 9.5, anchor: 'middle', fill: C.mut });
    const sk = el('g', { stroke: C.teal, 'stroke-width': 2.2, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    const head = el('circle', { cx: 103, cy: 336, r: 7, fill: C.tealL }, sk);
    const body = el('path', {}, sk), armL = el('path', {}, sk), armR = el('path', {}, sk), legs = el('path', {}, sk);
    const joints = [0, 1, 2, 3, 4, 5].map(() => el('circle', { r: 2.6, fill: C.teal, stroke: 'none' }, g));
    // buses + arrows
    const bus = (x, y1, y2) => el('line', { x1: x, x2: x, y1, y2, stroke: C.line, 'stroke-width': 1.8 }, g);
    const b1 = bus(202, 145, 355); const b2 = bus(398, 145, 355);
    const in1 = [145, 250, 355].map(y => arrow(g, [[178, y], [202, y]], { c: C.mut, h: 0.01 }));
    const a12 = arrow(g, [[202, 250], [224, 250]], { c: C.mut });
    // column 2
    const c2 = box(g, 226, 95, 160, 310, { r: 12, fill: '#fafafa' });
    const arch = ['CNN', 'RNN / LSTM', 'Transformer', 'Graph NN'].map((n, i) => node(g, 240, 125 + i * 66, 132, 52, n, ['spatial cues', 'temporal order', 'long-range context', 'relational structure'][i], { size: 12 }));
    const a23 = arrow(g, [[386, 250], [410, 250]], { c: C.mut });
    const c3 = box(g, 412, 95, 120, 310, { r: 12, fill: '#fafafa' });
    const fus = ['Early fusion', 'Late fusion', 'Hybrid'].map((n, i) => node(g, 424, 136 + i * 84, 96, 60, n, ['features', 'decisions', 'both'][i], { size: 11 }));
    const in3 = [0, 1, 2].map(i => arrow(g, [[398, 166 + i * 84], [424, 166 + i * 84]], { c: C.line, h: 0.01 }));
    const a34 = arrow(g, [[532, 250], [556, 250]], { c: C.mut });
    const c4 = box(g, 558, 95, 214, 310, { r: 12, fill: '#fafafa' });
    const outs = [['Emotional state', C.blue, .82], ['Intent', C.teal, .64], ['Next action', C.amber, .74]];
    const bars = outs.map((o, i) => {
      const y = 140 + i * 90; txt(g, 576, y, o[0], { size: 11.5, weight: 700, at: 6 });
      box(g, 576, y + 12, 178, 12, { r: 6, fill: C.soft, stroke: 'none', at: 6 });
      const b = el('rect', { x: 576, y: y + 12, width: 0, height: 12, rx: 6, fill: o[1] }, g);
      const pct = txt(g, 754, y, '', { size: 10.5, anchor: 'end', fill: C.mut, weight: 700 });
      return { b, pct, o, y };
    });
    const c4t = txt(g, 665, 385, 'what people feel, mean and do next', { size: 8.5, anchor: 'middle', fill: C.mut });
    return t => {
      cards.forEach((c, i) => op(c, ph(t, .3 + i * .25, .9 + i * .25)));
      hd.forEach((h, i) => op(h, ph(t, .3 + i * 1.6, .9 + i * 1.6)));
      const env = u => Math.sin(u * 9 + t * 3) * (.5 + .5 * Math.sin(u * 5 - t * 2)) * 26;
      setWave(wave, 40, 152, 126, env, 60); op(wave, ph(t, .5, 1));
      const k = Math.sin(t * 1.6) * 9; mouth.setAttribute('d', `M92,262 Q103,${262 + k} 114,262`);
      emoLbl.setText(k > 3 ? 'joy' : k < -3 ? 'sadness' : 'neutral'); op(face, ph(t, .7, 1.2)); op(emoLbl, ph(t, .7, 1.2));
      const a1 = 1.0 * Math.sin(t * 2.2), a2 = -1.0 * Math.sin(t * 2.2 + .6), cx = 103, sy = 354;
      const arm = (s, a) => `M${cx},${sy} L${cx + s * (14 * Math.cos(a + .9))},${sy + 14 * Math.sin(a + .9) + 6} L${cx + s * (14 * Math.cos(a + .9) + 12 * Math.cos(a * 1.4 + .3))},${sy + 14 * Math.sin(a + .9) + 6 + 12 * Math.sin(a * 1.4 + .3) + 4}`;
      armL.setAttribute('d', arm(-1, a1)); armR.setAttribute('d', arm(1, a2));
      body.setAttribute('d', `M${cx},343 L${cx},372`); legs.setAttribute('d', `M${cx},372 L${cx - 9},392 M${cx},372 L${cx + 9},392`);
      op(sk, ph(t, .9, 1.4));
      joints.forEach((j, i) => { const p = [[cx, 343], [cx, 372], [cx - 9, 392], [cx + 9, 392], [cx, sy], [cx, 343]][i]; j.setAttribute('cx', p[0]); j.setAttribute('cy', p[1]); op(j, ph(t, 1, 1.4)); });
      in1.forEach(a => a.set(ph(t, 1.4, 2))); [b1, b2].forEach(b => op(b, ph(t, 1.6, 2)));
      a12.set(ph(t, 1.9, 2.4)); op(c2, ph(t, 2, 2.5));
      const hiA = Math.floor(Math.max(0, t - 5.6) * 1.2) % 4;
      arch.forEach((n, i) => { op(n.g, ph(t, 2.2 + i * .3, 2.7 + i * .3)); const on = t > 5.6 && i === hiA; n.set(on ? C.blueL : '#fff', on ? C.blue : C.line); });
      a23.set(ph(t, 3.9, 4.4)); op(c3, ph(t, 4.2, 4.7));
      fus.forEach((n, i) => { op(n.g, ph(t, 4.4 + i * .3, 4.9 + i * .3)); const on = t > 6 && i === Math.floor((t - 6) * .9) % 3; n.set(on ? C.tealL : '#fff', on ? C.teal : C.line); });
      in3.forEach(a => a.set(0)); op(b2, ph(t, 4.2, 4.7));
      a34.set(ph(t, 5.3, 5.8)); op(c4, ph(t, 5.6, 6.1)); op(c4t, ph(t, 6.6, 7.2));
      bars.forEach((b, i) => { const u = ph(t, 6 + i * .3, 7 + i * .3); const val = b.o[2] + .05 * Math.sin(t * 2 + i * 2) * ph(t, 7, 7.5);
        b.b.setAttribute('width', 178 * val * u); b.pct.setText(Math.round(val * 100 * u) + '%'); op(b.pct, u); });
      hd.forEach(h => 0);
    };
  }
});

let s=performance.now();(function L(n){frame(((n-s)/1000)%SCENE.T);requestAnimationFrame(L)})(s);</script></body></html>
